    <script type="text/javascript">
	    function myFunction(){
            // 清除搜索结果预览区域的内容
	        document.getElementById("predictedResult").innerHTML= "";
	        $('#clear').hide();
	    }

        function displayImage(input) {
            if (input.files && input.files[0]) {
                var reader = new FileReader();

                reader.onload = function (e) {
                    $('#uploadedImage')
                        .attr('src', e.target.result)
                        .width(300); // 设置图片宽度
                };

                reader.readAsDataURL(input.files[0]);
                $('#uploadedImageContainer').show(); // 显示上传的图片区域
            }
        }


		function fun(){
		    $('#load').show();
   		    $("form").submit(function(evt){
		        //$('#loader-icon').show();
		        evt.preventDefault();
                //$('#loader-icon').show();
     		    var formData = new FormData($(this)[0]);

   		        $.ajax({
      		        url: 'imgUpload',
       		        type: 'POST',
      		        data: formData,
      		        //async: false,
      		        cache: false,
      		        contentType: false,
      		        enctype: 'multipart/form-data',
      		        processData: false,

      		        success: function (response) {
		                $('#load').hide();
		                $('#row1').show();
		                //$('#clear').show();
                        //console.log(response[1]);
        	            //document.getElementById("predictedResult").innerHTML= response;
                        document.getElementById("img0").src = response.image0;
		                document.getElementById("img1").src = response.image1;
                        document.getElementById("img2").src = response.image2;
                        document.getElementById("img3").src = response.image3;
                        document.getElementById("img4").src = response.image4;
                        document.getElementById("img5").src = response.image5;
                        document.getElementById("img6").src = response.image6;
                        document.getElementById("img7").src = response.image7;
                        document.getElementById("img8").src = response.image8;
                        $('#table').show();
		                $('#clear').show();
                        document.getElementById('refinement').style.display = 'block';
                        // 更新搜索结果概览
                        $('#searchSummary').html('<p>Total results: ' + 9 + '</p>');
      		        }
   		        });
                return false;
            })
        };

        var deletedNodes = [];

        function tagSelect() {
            restoreDeletedNodes();
            $('#load').show();
            $('#row1').hide();
            $('#table').hide();
            $('#clear').hide();
            var dropdown = document.getElementById("tags");
            var tagselectId = dropdown.options[dropdown.selectedIndex].id;
            var txtFilePath = '/tags/' + tagselectId + '.txt';
            var xhr = new XMLHttpRequest();
            var nums_of_photos=9;
            xhr.onreadystatechange = function() {
                if (xhr.readyState === XMLHttpRequest.DONE) {
                    if (xhr.status === 200) {
                        var imagesid = xhr.responseText.split('\r\n'); // 按行分割txt文件内容
                        for (var count = 0; count < 9; count++) {
                            var imgElement = document.getElementById('img' + count);
                            var src = imgElement.src;
                            var matches = src.match(/im(.*?)\.jpg/);
                            if (!imagesid.includes(matches[1])) {// 获取匹配到的数字
                                // 在删除之前保存节点、其父节点及其位置
                                var element = imgElement;
                                var parent = imgElement.parentNode.parentNode;
                                var index = Array.prototype.indexOf.call(parent.children, imgElement.parentNode);
                                deletedNodes.push({ element: element.parentNode, parent: parent, index: index });
                                nums_of_photos--;
                                // 删除节点
                                element.parentNode.parentNode.removeChild(element.parentNode);
                            }
                            $('#searchSummary').html('<p>Total results: ' + nums_of_photos + '</p>');
                        }
                    }
                }
            };
            $('#searchSummary').html('<p>Total results: ' + nums_of_photos + '</p>');
            xhr.open('GET', txtFilePath, true);
            xhr.setRequestHeader('Cache-Control', 'no-cache');
            xhr.send();
            $('#load').hide();
            $('#row1').show();
            $('#table').show();
            $('#clear').show();
        }
        // 恢复被删除的节点的函数
        function restoreDeletedNodes() {
            while (deletedNodes.length > 0) {
                var nodeInfo = deletedNodes.pop();
                nodeInfo.parent.insertBefore(nodeInfo.element, nodeInfo.parent.children[nodeInfo.index] || null);
            }
            deletedNodes = [];
        }

        // 用户添加收藏
        function addToFavorites(imageUrl){
            // 添加图片到收藏列表
            var favoriteItem = '<li><img src="' + imageUrl + '" alt="Favorite Image"></li>';
            $('#favoriteList').append(favoriteItem);
        }
        // 保存图片函数
        function saveImage(imageUrl) {
            // 创建一个隐藏的链接元素
            var link = document.createElement('a');
            link.href = imageUrl;
            link.download = 'image.jpg'; // 设置下载的文件名
            document.body.appendChild(link);
            link.click(); // 模拟点击链接以触发下载
            document.body.removeChild(link); // 下载完成后移除链接元素
        }
        // 监听图片右键点击事件
        $('#main img').on('contextmenu', function(e) {
            e.preventDefault(); // 阻止默认右键菜单的显示
            // 获取图片的 URL
            var imageUrl = $(this).attr('src');
            // 显示自定义右键菜单
            $('#contextMenu').css({
                display: 'block',
                left: e.pageX,
                top: e.pageY
            });
            // 将图片 URL 存储在自定义右键菜单的 data 属性中
            $('#contextMenu').data('imageUrl', imageUrl);
        });
        // 监听取消按钮点击事件
        $('#cancel').click(function() {
            $('#contextMenu').hide(); // 隐藏右键菜单
        });
        // 监听添加到收藏按钮点击事件
        $('#addToFavorites').click(function() {
            var imageUrl = $('#contextMenu').data('imageUrl'); // 获取图片 URL
            addToFavorites(imageUrl); // 添加到收藏列表
            $('#contextMenu').hide(); // 隐藏右键菜单
        });
        // 监听保存图片按钮点击事件
        $('#saveImage').click(function() {
            var imageUrl = $('#contextMenu').data('imageUrl'); // 获取图片 URL
            saveImage(imageUrl); // 保存图片
            $('#contextMenu').hide(); // 隐藏右键菜单
        });

        // 监听图片左键点击事件
        $('#main img').on('click', function() {
            var imageUrl = $(this).attr('src');
            // 显示模态框
            $('#imageModal').css('display', 'block');
            // 设置模态框中图片的src属性
            $('#modalImage').attr('src', imageUrl);
        });
        // 监听模态框中的关闭按钮点击事件
        $('.close').on('click', function() {
            // 关闭模态框
            $('#imageModal').css('display', 'none');
            // 清空模态框中的图片src属性
            $('#modalImage').attr('src', '');
        });


    </script>



</body>
</html>
